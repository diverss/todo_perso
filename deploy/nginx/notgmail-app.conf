# notgmail.fr + www + todo → app Django (Gunicorn)
# lettrage.notgmail.fr → lettrage (serve.py)
# storyboard.notgmail.fr → storyboard (Node)
# suivi.notgmail.fr → suivi_contenus (Django/Gunicorn)
# Source de vérité : installer via deploy/apply-nginx.sh
# Les chemins SSL pointent vers le certificat Let's Encrypt (géré par certbot).

upstream todo_perso_gunicorn {
    server 127.0.0.1:8000 fail_timeout=0;
}

upstream lettrage_app {
    server 127.0.0.1:8765 fail_timeout=0;
}

upstream storyboard_app {
    server 127.0.0.1:8001 fail_timeout=0;
}

upstream suivi_app {
    server 127.0.0.1:8002 fail_timeout=0;
}

# HTTP → HTTPS (tous les noms) + challenge ACME
server {
    listen 80;
    listen [::]:80;
    server_name notgmail.fr www.notgmail.fr todo.notgmail.fr lettrage.notgmail.fr storyboard.notgmail.fr suivi.notgmail.fr;

    location ^~ /.well-known/acme-challenge/ {
        root /var/www/certbot;
        default_type "text/plain";
        allow all;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

# HTTPS — todo / notgmail (Django)
server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name notgmail.fr www.notgmail.fr todo.notgmail.fr;

    # Certificat multi-domaines (certbot). Si le chemin change après --expand, certbot le met à jour.
    ssl_certificate     /etc/letsencrypt/live/notgmail/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/notgmail/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    client_max_body_size 25M;
    server_tokens off;

    location /media/ {
        alias /home/edmond/todo_perso/media/;
        access_log off;
        expires 7d;
        add_header Cache-Control "public";
    }

    location /static/ {
        alias /home/edmond/todo_perso/staticfiles/;
        access_log off;
        expires 30d;
        add_header Cache-Control "public, immutable";
    }

    location / {
        proxy_pass http://todo_perso_gunicorn;
        proxy_http_version 1.1;

        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host  $host;

        proxy_redirect off;
        proxy_read_timeout 60s;
        proxy_connect_timeout 10s;
    }
}

# HTTPS — lettrage manga
server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name lettrage.notgmail.fr;

    ssl_certificate     /etc/letsencrypt/live/notgmail/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/notgmail/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    # Exports PNG/ORA en base64 dans le body JSON
    client_max_body_size 100M;
    server_tokens off;

    location / {
        proxy_pass http://lettrage_app;
        proxy_http_version 1.1;

        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host  $host;

        proxy_redirect off;
        proxy_read_timeout 120s;
        proxy_connect_timeout 10s;
    }
}


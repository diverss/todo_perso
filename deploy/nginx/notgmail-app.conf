# HTTPS — suivi de contenus (Django/Gunicorn, port 8002)
server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name suivi.notgmail.fr;

    ssl_certificate     /etc/letsencrypt/live/notgmail/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/notgmail/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    # Imports par copier-coller d'un long historique (DATA_UPLOAD_MAX_MEMORY_SIZE = 25 Mo)
    client_max_body_size 25M;
    server_tokens off;

    # Pochettes AniList : servies directement, Django ne sert pas /media/ hors DEBUG.
    location /media/ {
        alias /home/edmond/suivi_contenus/media/;
        access_log off;
        expires 30d;
        add_header Cache-Control "public";
    }

    location /static/ {
        alias /home/edmond/suivi_contenus/staticfiles/;
        access_log off;
        expires 30d;
        add_header Cache-Control "public, immutable";
    }

    location / {
        proxy_pass http://suivi_app;
        proxy_http_version 1.1;

        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host  $host;

        proxy_redirect off;
        # Import AniList / rafraîchissement TMDB : même marge que le timeout Gunicorn.
        proxy_read_timeout 180s;
        proxy_connect_timeout 10s;
    }
}

# =============================================================================
# Modèle pour un nouveau sous-domaine → une app
#
# 1. Copier ce fichier :
#      cp TEMPLATE.app.notgmail.fr.conf monapp.notgmail.fr.conf
# 2. Remplacer APP / PORT / chemins
# 3. DNS : enregistrement A  monapp.notgmail.fr → IP du VPS
# 4. Appliquer :
#      sudo install -m 644 monapp.notgmail.fr.conf /etc/nginx/sites-available/
#      sudo ln -sfn /etc/nginx/sites-available/monapp.notgmail.fr.conf \
#                   /etc/nginx/sites-enabled/monapp.notgmail.fr.conf
#      sudo nginx -t && sudo systemctl reload nginx
# 5. HTTPS :
#      sudo certbot --nginx -d monapp.notgmail.fr
#
# Convention proposée :
#   Code app     : /home/edmond/apps/monapp/
#   Service      : systemd monapp.service (gunicorn/node/etc. sur 127.0.0.1:PORT)
#   Ports locaux : 8000=todo, 8001+, un port par app
# =============================================================================

upstream APP_backend {
    server 127.0.0.1:PORT fail_timeout=0;
}

server {
    listen 80;
    listen [::]:80;
    server_name APP.notgmail.fr;

    client_max_body_size 25M;
    server_tokens off;

    location ^~ /.well-known/acme-challenge/ {
        root /var/www/certbot;
        default_type "text/plain";
        allow all;
    }

    # Optionnel — fichiers statiques / uploads
    # location /media/ {
    #     alias /home/edmond/apps/APP/media/;
    # }
    # location /static/ {
    #     alias /home/edmond/apps/APP/staticfiles/;
    # }

    location / {
        proxy_pass http://APP_backend;
        proxy_http_version 1.1;

        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host  $host;

        proxy_redirect off;
        proxy_read_timeout 60s;
        proxy_connect_timeout 10s;
    }
}
